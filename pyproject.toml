[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datamind"
version = "0.1.0"
description = "A verifiable natural-language data agent powered by Snowflake and Google Gemma"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi==0.143.3",
  "httpx==0.28.1",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "pyyaml==6.0.3",
  "snowflake-connector-python==5.0.0",
  "sqlglot==30.23.0",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.17.1",
]

[project.scripts]
datamind = "datamind.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/datamind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "tmp"]
