name: "Feature Request"
description: "Suggest an idea or enhancement for DataMind"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We love new ideas! Please check open issues and discussions before submitting to avoid duplicates.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation? Please describe clearly.
      placeholder: I am always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Enhancement
      description: Describe what you would like to happen and how it fits into DataMind's trust architecture.
      placeholder: Add support for...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or workarounds you have considered.
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - Compiler / SQL Generation
        - Semantic Model
        - Gemma Planning / Prompts
        - Snowflake Connector / API
        - React Frontend / UI / Charts
        - Documentation / Tooling
    validations:
      required: true
  - type: checkboxes
    id: willingness
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a pull request for this feature!
