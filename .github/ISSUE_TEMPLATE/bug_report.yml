name: "Bug Report"
description: "File a bug report to help us fix errors or unexpected behaviors in DataMind"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please verify you are running the latest code and review [SUPPORT.md](../../SUPPORT.md) before filing.
        **Do NOT include real passwords, Snowflake PATs, or private datasets.**
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide detailed steps or the exact question asked in DataMind.
      placeholder: |
        1. Start API with `uv run uvicorn datamind.api:app`
        2. Ask question: "..."
        3. Observe error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Expected the query to compile and return results...
    validations:
      required: true
  - type: textarea
    id: query_evidence
    attributes:
      label: Query Evidence / SQL / Query ID
      description: If applicable, paste the generated SQL, error message, or Snowflake Query ID (strip any confidential values).
      render: sql
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Ubuntu / Debian Linux
        - Other Linux
        - Windows
    validations:
      required: true
  - type: input
    id: python_version
    attributes:
      label: Python Version
      placeholder: e.g., 3.13.0
    validations:
      required: true
  - type: input
    id: gemma_model
    attributes:
      label: Gemma Model Used
      placeholder: e.g., gemma4:e4b (via Ollama)
    validations:
      required: true
  - type: checkboxes
    id: checklists
    attributes:
      label: Validation Checklist
      options:
        - label: I confirmed that no credentials or private data are present in this report.
          required: true
        - label: I ran `uv run datamind doctor` and checked for local setup errors.
          required: false
